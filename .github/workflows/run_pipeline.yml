name: GCS to BigQuery Data Pipeline

on:
  workflow_dispatch: # Allows you to manually trigger this pipeline with a click of a button in GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Cloud Libraries
      run: |
        pip install google-cloud-storage google-cloud-bigquery

    - name: Install Google Cloud SDK (gcloud & bq tools)
      uses: google-github-actions/setup-gcloud@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }} # Securely loads your secret access key

    - name: Run Pipeline Script
      run: |
        python gcs_to_bigquery_pipeline.py

